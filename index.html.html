<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physician Wealth Insights</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* New doctor background */
    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    /* Dark overlay for readability */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.56);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(1000px, 92vw);
      text-align: center;
      color: white;
      transform: translateY(-2%);
    }

    h1 {
      margin: 0 0 34px;
      font-size: clamp(36px, 4vw, 58px);
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .subtitle {
      max-width: 1000px;
      margin: 0 auto 48px;
      font-size: clamp(17px, 1.55vw, 24px);
      line-height: 1.55;
      font-weight: 400;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }

    .whatsapp-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 390px;
      height: 62px;
      padding: 0 48px;
      border-radius: 40px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 5px 18px rgba(0,0,0,.28);
      transition: transform .15s ease, background .15s ease;
    }

    .whatsapp-button:hover {
      background: #20bd5a;
      transform: translateY(-2px);
    }

    .whatsapp-button:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 32px;
      font-size: 14px;
      color: rgba(255,255,255,.92);
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }

    @media (max-width: 700px) {
      .content {
        width: 90vw;
      }

      h1 {
        margin-bottom: 24px;
      }

      .subtitle {
        margin-bottom: 34px;
        font-size: 16px;
        line-height: 1.45;
      }

      .whatsapp-button {
        min-width: 0;
        width: 82vw;
        max-width: 390px;
        height: 56px;
        padding: 0 25px;
        font-size: 18px;
      }

      .footer {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <img
      class="background"
      src="https://www.rfhospital.org/sites/default/files/2025-06/international-patients_banner_0.jpg"
      alt="Doctor consulting with a patient"
    >

    <div class="overlay"></div>

    <section class="content">
      <h1>Physician Wealth Insights</h1>

      <p class="subtitle">
        A private learning community for physicians and healthcare professionals
        interested in global markets, investing education, and long-term wealth strategies.
      </p>

      <a
        class="whatsapp-button"
        href="https://chat.whatsapp.com/CPP7x7pwO7QLW9PMEjgk2E"
        target="_blank"
        rel="noopener noreferrer"
      >
        Join WhatsApp Community
      </a>

      <div class="footer">
        Educational community &nbsp;•&nbsp; Long-term wealth discussions
      </div>
    </section>

  </main>
</body>
</html>
